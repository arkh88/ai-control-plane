name: ai-control-plane

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile

    image: ai-control-plane:dev

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      PYTHONUNBUFFERED: "1"

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  mock-provider:
    build:
      context: .
      dockerfile: Dockerfile

    image: ai-control-plane:dev

    command:
      - uvicorn
      - app.mock_provider:app
      - --host
      - "0.0.0.0"
      - --port
      - "8001"

    expose:
      - "8001"

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s