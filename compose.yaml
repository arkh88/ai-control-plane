name: ai-control-plane

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile

    image: ai-control-plane:dev

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      PYTHONUNBUFFERED: "1"
      MOCK_PROVIDER_URL: "http://mock-provider:8001"
      OPA_URL: "http://opa:8181"
      AICP_API_KEY_SHA256: "${AICP_API_KEY_SHA256:?Set AICP_API_KEY_SHA256}"
      AICP_APP_ID: "${AICP_APP_ID:-demo-app}"
      AICP_EVIDENCE_DB_PATH: "/tmp/aicp-evidence/evidence.sqlite3"
    # governance database — connectivity
      AICP_GOVERNANCE_DB_HOST: "postgres"
      AICP_GOVERNANCE_DB_USER: "aicp"
      AICP_GOVERNANCE_DB_NAME: "aicp"
      AICP_GOVERNANCE_DB_PASSWORD: "${AICP_POSTGRES_PASSWORD:?Set AICP_POSTGRES_PASSWORD}"
    volumes:
      - ./local-data/evidence:/tmp/aicp-evidence
    
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  mock-provider:
    build:
      context: .
      dockerfile: Dockerfile

    image: ai-control-plane:dev

    command:
      - uvicorn
      - app.mock_provider:app
      - --host
      - "0.0.0.0"
      - --port
      - "8001"

    expose:
      - "8001"

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  opa:
    image: openpolicyagent/opa:1.21.4

    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-level=info
      - /policies/model_access.rego
    
    volumes:
      - ./policies:/policies:ro

    expose:
      - "8181"

    read_only: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped

  postgres:
    image: postgres:17-bookworm

    environment:
      POSTGRES_USER: "aicp"
      POSTGRES_DB: "aicp"
      POSTGRES_PASSWORD: "${AICP_POSTGRES_PASSWORD:?Set AICP_POSTGRES_PASSWORD}"

    volumes:
      - aicp-postgres-data:/var/lib/postgresql/data

    expose:
      - "5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicp -d aicp"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped  

volumes:
  aicp-postgres-data: